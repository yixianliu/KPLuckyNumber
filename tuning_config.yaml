meta:
  experiment_id: exp_freeze_control
  based_on: v3.15_freeze
  author: auto
  created: '2026-07-21'
  note: 控制组; 派生自 排列5_v3.15参数冻结清单.md; AI已禁用以隔离统计信号
algorithms:
  frequency_weighted:
    enabled: true
    weight: 0.54
    params:
      lookback_periods: 60
      smoothing_factor: 0.1
      recency_weight: false
      recency_decay: 0.03
  omission_regression:
    enabled: true
    weight: 0.34
    params:
      max_omission_cap: 50
      regression_steepness: 0.018
      linear_bonus: true
  bayesian_inference:
    enabled: true
    weight: 0.1
    params:
      prior_smooth: 0.1
      posterior_weight: 0.92
      verification_window: 60
      penalize_miss: 0.68
      reward_hit: 1.4
      decay_half_life: 10
      beta_alpha: 0.8
      prior_temporal_scale: 50
      min_verification_samples: 50
  trend_momentum:
    enabled: true
    weight: 0.01
    params:
      trend_window: 30
      momentum_factor: 0.88
  markov_transition:
    enabled: true
    weight: 0.005
    params:
      order: 1
      decay_factor: 0.92
      min_transition_prob: 0.02
  pattern_continuation:
    enabled: true
    weight: 0.003
    params:
      pattern_window: 7
      continuation_boost: 1.12
  feature_engineering:
    enabled: true
    weight: 0.002
    params:
      freq_weight: 0.3
      omission_weight: 0.25
      road_weight: 0.15
      repeat_weight: 0.15
      consecutive_weight: 0.15
global:
  position_top_n: 6
  enable_boundary_protection: false
  enable_adaptive_weights: false
  adaptive_metric: top1_hit
  ewma_alpha: 0.3
  ewma_blend: 0.1
  minor_max_weight: 0.1
  enable_ai_model: false
  ai_model_weight: 0.1
quality_gates:
  predicted_numbers_format: flat
  min_verification_samples: 50
  max_missing_rate: 0.02
